services:
  postgres:
    image: pgvector/pgvector:pg14
    container_name: tsk-postgres
    environment:
      POSTGRES_USER: tsk
      POSTGRES_PASSWORD: tsk
      POSTGRES_DB: taisang
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tsk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsk -d taisang"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tsk_pg: